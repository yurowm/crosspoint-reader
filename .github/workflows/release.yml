name: Compile Release

# Builds the X4 release firmware on tag push and publishes it as firmware.bin,
# exactly as OtaUpdater requests it from the GitHub release. The firmware's OTA
# updater discovers that single X4 image through releases/latest.

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e gh_release -j1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware.bin
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate release version
        run: |
          VERSION=$(sed -n 's/^version = //p' platformio.ini | head -n 1)
          TAG_VERSION=${GITHUB_REF_NAME#release/}
          if [ "${GITHUB_REF_NAME}" = "${TAG_VERSION}" ] || [ "${TAG_VERSION}" != "${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} must be release/${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware.bin
          path: dist

      - name: Stage OTA assets
        run: |
          mkdir release
          SOURCE=$(find dist -type f -name firmware.bin -print -quit)
          if [ -z "${SOURCE}" ]; then
            echo "Missing release asset: firmware.bin" >&2
            exit 1
          fi
          cp "${SOURCE}" release/firmware.bin

      - name: Publish release for OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --yes 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            release/firmware.bin \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --generate-notes \
            --verify-tag
