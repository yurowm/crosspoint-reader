name: Compile Release

# Builds the X4 and X4 Pro release firmware on tag push. Asset names match what
# OtaUpdater requests for each board through releases/latest.

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  build-release:
    name: Build ${{ matrix.pio_env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset: firmware.bin
            artifact: release-x4
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
            artifact: release-x4pro
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate release version
        run: |
          VERSION=$(sed -n 's/^version = //p' platformio.ini | head -n 1)
          TAG_VERSION=${GITHUB_REF_NAME#release/}
          if [ "${GITHUB_REF_NAME}" = "${TAG_VERSION}" ] || [ "${TAG_VERSION}" != "${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} must be release/${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist

      - name: Stage OTA assets
        run: |
          mkdir release
          SOURCE=$(find dist -type f -name firmware.bin -print -quit)
          if [ -z "${SOURCE}" ]; then
            echo "Missing release asset: firmware.bin" >&2
            exit 1
          fi
          cp "${SOURCE}" release/firmware.bin
          X4PRO_SOURCE=$(find dist -type f -name firmware-x4pro.bin -print -quit)
          if [ -z "${X4PRO_SOURCE}" ]; then
            echo "Missing release asset: firmware-x4pro.bin" >&2
            exit 1
          fi
          cp "${X4PRO_SOURCE}" release/firmware-x4pro.bin

      - name: Publish release for OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes/${VERSION}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            echo "Missing release notes: ${NOTES_FILE}" >&2
            exit 1
          fi
          gh release delete "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --yes 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            release/firmware.bin \
            release/firmware-x4pro.bin \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag
