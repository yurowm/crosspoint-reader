location = /_crosspoint_calibre_auth {
    internal;
    proxy_pass http://172.18.0.1:8080/calibre/ajax/library-info;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}

location = /calibre/crosspoint-sync/v1/manifest.json {
    auth_request /_crosspoint_calibre_auth;
    proxy_pass http://172.18.0.1:8091/manifest.json;
    proxy_set_header Connection close;
    proxy_buffering off;
}

location ~ "^/calibre/crosspoint-sync/v1/books/[0-9a-f]{64}\.epub$" {
    auth_request /_crosspoint_calibre_auth;
    rewrite ^/calibre/crosspoint-sync/v1/(.*)$ /$1 break;
    proxy_pass http://172.18.0.1:8091;
    proxy_set_header Connection close;
    proxy_buffering off;
}

location ^~ /calibre/crosspoint-sync/v1/ {
    return 404;
}
