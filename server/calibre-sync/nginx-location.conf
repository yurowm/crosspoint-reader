location = /_crosspoint_calibre_auth {
    internal;
    proxy_pass http://172.18.0.1:8080/calibre/ajax/library-info;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}

location = /calibre/crosspoint-sync/v1/manifest.json {
    auth_request /_crosspoint_calibre_auth;
    alias /var/lib/crosspoint-sync/manifest.json;
    default_type application/json;
}

location ^~ /calibre/crosspoint-sync/v1/books/ {
    auth_request /_crosspoint_calibre_auth;
    alias /var/lib/crosspoint-sync/books/;
    default_type application/epub+zip;
}

location ^~ /calibre/crosspoint-sync/v1/ {
    return 404;
}
